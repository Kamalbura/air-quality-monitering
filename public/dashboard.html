<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            color: white;
        }

        .status-item {
            text-align: center;
        }

        .status-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .card h3 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .metric-name {
            font-weight: 600;
            color: #555;
        }

        .metric-value {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            color: white;
        }

        .temp { background: linear-gradient(45deg, #ff6b6b, #ee5a24); }
        .humidity { background: linear-gradient(45deg, #54a0ff, #2e86de); }
        .pm25 { background: linear-gradient(45deg, #5f27cd, #341f97); }
        .pm10 { background: linear-gradient(45deg, #00d2d3, #006ba6); }

        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        @media (max-width: 768px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Air Quality Monitoring</h1>
            <p>Real-time environmental data from ThingSpeak</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div>Status</div>
                <div class="status-value" id="connectionStatus">Connecting...</div>
            </div>
            <div class="status-item">
                <div>Last Update</div>
                <div class="status-value" id="lastUpdate">---</div>
            </div>
            <div class="status-item">
                <div>Data Points</div>
                <div class="status-value" id="dataCount">---</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="refreshData()">🔄 Refresh Data</button>
            <button class="btn btn-secondary" onclick="changeTimeRange('1')">Last 1h</button>
            <button class="btn btn-secondary" onclick="changeTimeRange('6')">Last 6h</button>
            <button class="btn btn-secondary" onclick="changeTimeRange('24')">Last 24h</button>
            <button class="btn btn-secondary" onclick="changeTimeRange('168')">Last Week</button>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3>📊 Current Readings</h3>
                <div id="currentReadings">
                    <div class="loading">Loading current data...</div>
                </div>
            </div>

            <div class="card">
                <h3>📈 Statistics</h3>
                <div id="statistics">
                    <div class="loading">Loading statistics...</div>
                </div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h3>🌡️ Temperature & Humidity</h3>
                <canvas id="tempHumidityChart"></canvas>
            </div>
            <div class="chart-container">
                <h3>💨 Particulate Matter</h3>
                <canvas id="particulateChart"></canvas>
            </div>
        </div>

        <div class="chart-container">
            <h3>📊 Combined Overview</h3>
            <canvas id="overviewChart"></canvas>
        </div>
    </div>

    <script>
        // Global variables
        let tempHumidityChart, particulateChart, overviewChart;
        let currentTimeRange = '24'; // hours

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initializeCharts();
            loadData();
            
            // Auto-refresh every 5 minutes
            setInterval(loadData, 5 * 60 * 1000);
        });

        // Initialize charts
        function initializeCharts() {
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            displayFormats: {
                                hour: 'HH:mm',
                                day: 'MM/DD'
                            }
                        }
                    }
                }
            };

            // Temperature & Humidity Chart
            const tempHumidityCtx = document.getElementById('tempHumidityChart').getContext('2d');
            tempHumidityChart = new Chart(tempHumidityCtx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Temperature (°C)',
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        yAxisID: 'y'
                    }, {
                        label: 'Humidity (%)',
                        borderColor: '#54a0ff',
                        backgroundColor: 'rgba(84, 160, 255, 0.1)',
                        yAxisID: 'y1'
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Humidity (%)'
                            },
                            grid: {
                                drawOnChartArea: false,
                            },
                        }
                    }
                }
            });

            // Particulate Matter Chart
            const particulateCtx = document.getElementById('particulateChart').getContext('2d');
            particulateChart = new Chart(particulateCtx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'PM2.5 (μg/m³)',
                        borderColor: '#5f27cd',
                        backgroundColor: 'rgba(95, 39, 205, 0.1)'
                    }, {
                        label: 'PM10 (μg/m³)',
                        borderColor: '#00d2d3',
                        backgroundColor: 'rgba(0, 210, 211, 0.1)'
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            title: {
                                display: true,
                                text: 'Concentration (μg/m³)'
                            }
                        }
                    }
                }
            });

            // Overview Chart
            const overviewCtx = document.getElementById('overviewChart').getContext('2d');
            overviewChart = new Chart(overviewCtx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Temperature (°C)',
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        yAxisID: 'y'
                    }, {
                        label: 'Humidity (%)',
                        borderColor: '#54a0ff',
                        backgroundColor: 'rgba(84, 160, 255, 0.1)',
                        yAxisID: 'y1'
                    }, {
                        label: 'PM2.5 (μg/m³)',
                        borderColor: '#5f27cd',
                        backgroundColor: 'rgba(95, 39, 205, 0.1)',
                        yAxisID: 'y2'
                    }, {
                        label: 'PM10 (μg/m³)',
                        borderColor: '#00d2d3',
                        backgroundColor: 'rgba(0, 210, 211, 0.1)',
                        yAxisID: 'y2'
                    }]
                },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Temperature (°C)'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Humidity (%)'
                            },
                            grid: {
                                drawOnChartArea: false,
                            }
                        },
                        y2: {
                            type: 'linear',
                            display: false,
                            position: 'right'
                        }
                    }
                }
            });
        }

        // Load data from API
        async function loadData() {
            try {
                document.getElementById('connectionStatus').textContent = 'Loading...';
                
                // Load current readings
                const latestResponse = await axios.get('/api/latest');
                if (latestResponse.data.success) {
                    updateCurrentReadings(latestResponse.data.data);
                }

                // Load historical data
                const historicalResponse = await axios.get(`/api/historical?hours=${currentTimeRange}`);
                if (historicalResponse.data.success) {
                    updateCharts(historicalResponse.data.data);
                    document.getElementById('dataCount').textContent = historicalResponse.data.count;
                }

                // Load statistics
                const statsResponse = await axios.get('/api/stats');
                if (statsResponse.data.success) {
                    updateStatistics(statsResponse.data.stats);
                }

                document.getElementById('connectionStatus').textContent = 'Connected';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('connectionStatus').textContent = 'Error';
                showError('Failed to load data: ' + error.message);
            }
        }

        // Update current readings display
        function updateCurrentReadings(data) {
            const container = document.getElementById('currentReadings');
            container.innerHTML = `
                <div class="metric">
                    <span class="metric-name">Temperature</span>
                    <span class="metric-value temp">${data.temperature.toFixed(1)}°C</span>
                </div>
                <div class="metric">
                    <span class="metric-name">Humidity</span>
                    <span class="metric-value humidity">${data.humidity.toFixed(1)}%</span>
                </div>
                <div class="metric">
                    <span class="metric-name">PM2.5</span>
                    <span class="metric-value pm25">${data.pm25.toFixed(1)} μg/m³</span>
                </div>
                <div class="metric">
                    <span class="metric-name">PM10</span>
                    <span class="metric-value pm10">${data.pm10.toFixed(1)} μg/m³</span>
                </div>
            `;
        }

        // Update statistics display
        function updateStatistics(stats) {
            const container = document.getElementById('statistics');
            container.innerHTML = `
                <div class="metric">
                    <span class="metric-name">Avg Temperature</span>
                    <span class="metric-value temp">${stats.temperature.avg.toFixed(1)}°C</span>
                </div>
                <div class="metric">
                    <span class="metric-name">Avg Humidity</span>
                    <span class="metric-value humidity">${stats.humidity.avg.toFixed(1)}%</span>
                </div>
                <div class="metric">
                    <span class="metric-name">Avg PM2.5</span>
                    <span class="metric-value pm25">${stats.pm25.avg.toFixed(1)} μg/m³</span>
                </div>
                <div class="metric">
                    <span class="metric-name">Total Records</span>
                    <span class="metric-value" style="background: #28a745;">${stats.totalRecords.toLocaleString()}</span>
                </div>
            `;
        }

        // Update charts with new data
        function updateCharts(data) {
            // Prepare data for charts
            const timestamps = data.map(d => new Date(d.timestamp));
            const temperatures = data.map(d => d.temperature);
            const humidities = data.map(d => d.humidity);
            const pm25Values = data.map(d => d.pm25);
            const pm10Values = data.map(d => d.pm10);

            // Update Temperature & Humidity Chart
            tempHumidityChart.data.labels = timestamps;
            tempHumidityChart.data.datasets[0].data = temperatures;
            tempHumidityChart.data.datasets[1].data = humidities;
            tempHumidityChart.update();

            // Update Particulate Matter Chart
            particulateChart.data.labels = timestamps;
            particulateChart.data.datasets[0].data = pm25Values;
            particulateChart.data.datasets[1].data = pm10Values;
            particulateChart.update();

            // Update Overview Chart
            overviewChart.data.labels = timestamps;
            overviewChart.data.datasets[0].data = temperatures;
            overviewChart.data.datasets[1].data = humidities;
            overviewChart.data.datasets[2].data = pm25Values;
            overviewChart.data.datasets[3].data = pm10Values;
            overviewChart.update();
        }

        // Refresh data manually
        async function refreshData() {
            try {
                const response = await axios.post('/api/refresh');
                if (response.data.success) {
                    await loadData();
                    showSuccess('Data refreshed successfully!');
                }
            } catch (error) {
                showError('Failed to refresh data: ' + error.message);
            }
        }

        // Change time range
        function changeTimeRange(hours) {
            currentTimeRange = hours;
            loadData();
            
            // Update button states
            document.querySelectorAll('.btn-secondary').forEach(btn => {
                btn.style.background = '#6c757d';
            });
            event.target.style.background = '#667eea';
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.cards-grid'));
            
            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.style.cssText = 'background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin: 10px 0;';
            successDiv.textContent = message;
            document.querySelector('.container').insertBefore(successDiv, document.querySelector('.cards-grid'));
            
            setTimeout(() => successDiv.remove(), 3000);
        }
    </script>
</body>
</html>
